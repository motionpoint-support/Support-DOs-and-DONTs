<script>
const STEP_HTML = "<div style=\"height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(11,37,69,.22); animation: pop 0.78s ease both;\">\n<span class=\"disp\" style=\"width: 40px; height: 40px; border-radius: 20px; background: #5DB645; color: #0B2545; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">{{st.n}}</span>\n<span style=\"font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;\">Part {{st.n}} of 9</span>\n</div>";
const SUB_OPEN = "<div style=\"position: absolute; left: 48px; right: 48px; top: 0; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; color: #F4F7FB; animation: up 0.7s ease both;\">";
function fit(){ const s = Math.min(window.innerWidth / 1280, window.innerHeight / 870); document.getElementById('fit').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
class Player {
  constructor() {
    this.state = { scene: 0, el: 0, playing: false, started: false, ended: false, music: true, subsOn: true };
    this.ctx = null;
  }
  durs() { return [26000, 70000, 70000, 84000, 84000, 70000, 70000, 70000, 92000, 110000]; }
  subLines() {
    return [[[0, "Welcome! This video covers the DOs and DON'Ts of Support at MotionPoint."], [5000, "Our cases: read first, complete milestones, and write clear notes with clear next steps."], [8000, "Our words: polite, gentle, and respectful. Never in anger, and never sarcastic."], [11000, "Our team: teamwork, not solo work."], [14000, "And our mindset: resourceful, proactive, and never assuming."], [19000, "Build these habits now. They make you someone the team can count on."]],
      [[0, "Part 1: mindset."], [5000, "We are customer advocates. We acknowledge, understand, document, and route each case to the right team."], [8500, "We own the case from start to finish."], [11000, "We don't have to fix everything ourselves. We make sure it gets fixed, and that the customer always knows what's happening."], [27000, "Our goal is for you to become independent and reliable."], [29500, "Take notes, and build your own playbook. Learn something once, then own it."], [33000, "Do your job without being reminded, and follow through on what you said you'd do."], [37000, "Don't ask the same question every day, wait to be told what to do, or stay stuck without trying."], [44000, "Reliable means the team never has to wonder if it's done."], [49000, "Now, some corporate common sense. Be on time, and show your real status in Teams. Keep it professional, even in chats."], [54000, "Protect customer and company information."], [56000, "Don't assume someone else will handle it, or that they've seen your message. Never assume. Always be sure."]],
      [[0, "Part 2: teamwork. Teamwork is what we need."], [5000, "We are a team, not a group of individuals working alone."], [7500, "Share the load when it's busy. Help a teammate who's buried. Keep the team informed."], [12000, "Don't work like a lone individual, keep knowledge to yourself, or disappear when things get busy."], [27000, "Volunteer when someone needs help."], [30000, "Offer to cover an email shift or an on-call shift when a teammate needs it."], [35000, "See someone overloaded? Offer to help. Don't wait to be asked twice."], [49000, "The golden rule: do for others what you'd like done for you."], [53000, "Cover shifts, because you'll need a cover one day too."], [56000, "Leave cases the way you'd want to receive them, and share what you learn."]],
      [[0, "Part 3: case etiquette. The case is our shared record."], [5000, "Before you add a note, read the title and description thoroughly, and the latest notes too."], [8000, "What is the customer really asking? Which page, which language, since when? Is there a deadline?"], [10500, "Then add your note. Never skim."], [25000, "Complete your milestones. When needed, match the due date to the customer's request in the description."], [28500, "And check if the description calls for moving the priority of the case up to Critical."], [31500, "Keep the status accurate, and log your time in My Day."], [34000, "Don't leave milestones open, or let a case sit with no update. An untouched case looks forgotten."], [45000, "Write notes that read naturally. Full, friendly sentences."], [48000, "No shorthand, and no internal jargon for customers."], [52000, "Read it out loud. Does it sound human?"], [65000, "Don't just copy and paste what the last person said."], [68500, "Always state the next steps: who does what next, and by when."], [71000, "And what, if anything, we need from the customer."]],
      [[0, "Part 4: communication."], [5000, "Be polite, gentle, and respectful. Use the customer's name, and thank them. Keep it simple and clear."], [9500, "Stay calm, even when they aren't."], [11000, "Never respond in anger. Never use sarcasm. Ever. Don't blame the customer or another team."], [25000, "When it gets tough, pause before you reply."], [28000, "Acknowledge their frustration, own it, and give clear next steps."], [32000, "Not sure about your reply? Ask a teammate to read it first."], [45000, "Express and Critical cases: this one is super important. A case update alone is not enough."], [48000, "Message the owner on Teams right away. No acknowledgment? Message again."], [52000, "Still nothing? Involve their manager or director."], [54500, "If they aren't responding, you may add an internal note to the case that the TAM, PE, or whichever team you're reaching out to has been notified through Teams."], [60500, "Never assume they've seen it."], [65000, "On Teams, acknowledge every @support message. React, or reply."], [69000, "On the phone, never cold transfer. Keep the customer on the line, and message the team."], [73000, "And never share company information."]],
      [[0, "Part 5: the Client Note report."], [5000, "When you work cases from the Client Note report, read each customer update carefully."], [8000, "Make the case owner aware of every update. Add it to the case, and message them on Teams."], [12000, "Express or Critical? Keep messaging until they acknowledge. Never assume they'll spot it in the case."], [27000, "Sometimes the customer reports something new inside an old case."], [30000, "Open a new case for the new issue, tell the customer it will be worked on separately, and share the new case number."], [36000, "One issue, one case. No confusion."], [49000, "Here's how that reply could look. Thank them, and confirm the original fix."], [53000, "Give them the new case number, and let them know you'll keep them updated there."], [56000, "Then route the new case like any other. Each case stays clear: its own issue, its own owner, its own next steps."]],
      [[0, "Part 6: be resourceful. Look first, then escalate."], [5000, "Most answers already exist somewhere."], [7000, "Search old cases for a match, and follow what was done."], [9000, "Check the Support OneNote, under Support - Procedures. Use your tools and training material, like these videos. Search Confluence."], [14000, "Then, ask Tier II, or the specialized team."], [27000, "Search old cases by customer and issue."], [31000, "Found a match? Same customer, same issue? See what was done, and follow the same steps."], [35000, "And mention the old case in your note, so the next person can see it too."], [49000, "Questions are welcome, after you've looked. Try first, then ask, and say what you already checked."], [55000, "Write down the answer you get, and share it. Don't escalate before looking, and don't ask the same thing twice."]],
      [[0, "Part 7: hand-offs."], [5000, "Route the case to the right team: PE, TAM, QA, or CXM."], [8000, "Include everything they need: the PID, the URL, steps to replicate, a screenshot, and any similar case."], [11000, "No one should have to ask you a question to get started. And say thank you. It matters."], [27000, "Never assign a case blind. Before you assign it, ask yourself:"], [29500, "Do I understand the issue? Do I have the steps to replicate it? The files, screenshots, and PIDs?"], [33500, "Can the next person start right away?"], [35000, "Any no? Don't assign it yet. Keep investigating, or ask the customer for what's missing. Otherwise, it bounces right back."], [49000, "Use the right project's Related Contacts. Tell the internal team about customer invites. Check account Warnings before instructing the PE."], [55000, "Document every hand-off in the case. Never hand off with just: see below."]],
      [[0, "Part 8: proactivity, and the DON'T list."], [5000, "No pending client responses, no emails, no calls?"], [7000, "Check your own queue and clean it up. New and In Progress cases, Express and Critical first. Then your Standard cases."], [13000, "Don't just think: I have nothing to do. There's always a case to move forward."], [15000, "And keep your utilization above 90 percent."], [27000, "Update the customer before they ask. Follow up when a team hasn't replied."], [32000, "Spot a pattern? Tell your team. Learn something new? Share it."], [36000, "Don't stop at: it's not my case."], [49000, "Now, the DON'T list. Never respond in anger, or use sarcasm. Never copy and paste without next steps, or skim the title and description."], [54000, "Don't assume someone saw it. Never cold transfer a call, or share company information."], [58000, "Don't use another project's contacts, assign a case you don't understand, or escalate before looking."], [62000, "Don't mix a new issue into an old case, and don't work alone when the team needs you."], [71000, "And after you've looked, if you're still in doubt, ask."], [75000, "The Support team, Tier II, or the Director of Customer Support. Never assume. Always be sure."]],
      [[0, "Part 9: practice. What would you do?"], [4000, "A teammate's last note says: PE checking. You're updating the customer."], [9000, "Write it in your own words, and say who does what next, and by when."], [14000, "A customer replies angrily that no one is helping them."], [19000, "Pause. Apologize, show you read the history, and give clear next steps."], [24000, "Your Express case update got no reply from the TAM on Teams."], [29000, "Message again. Still nothing? Involve their manager or director."], [34000, "Working the Client Note report, a customer says the fix worked, and asks about a new page."], [39000, "Tell the owner about the update. Open a new case for the new page, and tell the customer."], [44000, "You're not sure how to handle a case."], [49000, "Search old cases, OneNote, training, and Confluence first. Then ask Tier II, with what you found."], [54000, "You want to assign a case to PE, but you can't replicate the issue yet."], [59000, "Don't assign it yet. Get the steps, files, and screenshots first."], [64000, "A teammate asks if anyone can cover their on-call shift."], [69000, "Volunteer if you can. Do for others what you'd like done for you."], [74000, "No emails, no calls, nothing pending. What now?"], [79000, "Clean up your queue. Express and Critical first, then Standard."], [86000, "Quick recap."], [102000, "Build these habits now. Welcome to the team, and thanks for watching!"]]];
  }
  labels() { return ["Intro", "Mind", "Team", "Cases", "Talk", "Notes", "Search", "Handoff", "Ahead", "Practice"]; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9
    ];
  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
  }
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running' || !this.musicLive) return;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.3) {
      this.scheduleBeat(this.beat, this.nextT);
      this.beat = (this.beat + 1) % 32;
      this.nextT += 60 / 80;
    }
  }
  musicStart() {
    if (!this.state.music || !this.initAudio()) return;
    const c = this.ctx;
    try { c.resume(); } catch (e) {}
    if (!this.musicLive) {
      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i, off) {
    off = off || 0;
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => {
      this.setState({ scene: i, el: off, started: true, playing: true, ended: false });
      if (off) setTimeout(() => this.sync(off), 60);
    }, 40);
  }
  sync(off) {
    try {
      const st = document.querySelector('.stage');
      if (!st || !st.getAnimations) return;
      st.getAnimations({ subtree: true }).forEach((a) => { try { a.currentTime = off; } catch (e) {} });
    } catch (e) {}
  }
  jump(delta) {
    const d = this.durs();
    const s = this.state;
    const cur = s.scene < 0 ? 0 : s.scene;
    let t = 0;
    for (let i = 0; i < cur; i++) t += d[i];
    t += (s.scene < 0 || !s.started) ? 0 : s.el;
    const total = d.reduce((a, b) => a + b, 0);
    t = Math.max(0, Math.min(t + delta, total - 500));
    let i = 0;
    while (i < d.length - 1 && t >= d[i]) { t -= d[i]; i++; }
    this.go(i, t);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7, s8: vis === 8, s9: vis === 9,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
</body>
